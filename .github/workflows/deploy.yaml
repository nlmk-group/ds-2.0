name: Deploy Storybook
on:
  push:
    branches:
      - main # запускаем только при push в main

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install v20 Node version
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install and Build
        run: |
          npm install --global yarn
          yarn
          yarn storybook:build
          touch ./storybook-static/.nojekyll

      - name: Read previously deployed assets
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: previous-pages
          sparse-checkout: |
            assets
            asset-files.json
          sparse-checkout-cone-mode: false

      - name: Retain lazy chunks for open tabs
        run: node script/retain-storybook-assets.mjs storybook-static previous-pages

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: storybook-static
