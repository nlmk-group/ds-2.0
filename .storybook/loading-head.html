<script>
  (() => {
    let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    try {
      const saved = localStorage.getItem('nlmk-storybook-theme');
      const savedClass = localStorage.getItem('nlmk-storybook-theme-class');
      if (saved === 'light' || saved === 'dark') dark = saved === 'dark';
      else if (savedClass) dark = savedClass === 'dark-theme';
    } catch {
      // Embedded previews may have no storage access.
    }
    document.documentElement.dataset.theme = dark ? 'dark-theme' : 'light-theme';
  })();
</script>
