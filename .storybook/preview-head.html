<script>
    window.global = window;

    // Recover an older tab only if the server actually has a different preview build.
    let checkingBuild = false;
    window.addEventListener('vite:preloadError', async () => {
        if (checkingBuild) return;
        const selector = 'script[type="module"][src^="./assets/iframe-"]';
        const current = document.querySelector(selector)?.getAttribute('src');
        if (!current) return;
        checkingBuild = true;
        try {
            const url = new URL(location.href);
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) return;
            const html = new DOMParser().parseFromString(await response.text(), 'text/html');
            const latest = html.querySelector(selector)?.getAttribute('src');
            if (latest && latest !== current && url.searchParams.get('sb-build') !== latest) {
                url.searchParams.set('sb-build', latest);
                location.replace(url);
            }
        } catch {
            // Let the preview report the original error when the server is unavailable.
        } finally {
            checkingBuild = false;
        }
    });
</script>
